services:
  campuslearn:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campuslearn
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      PORT: 3000
    volumes:
      - /var/lib/campuslearn:/data
    ports:
      - "127.0.0.1:3000:3000"
